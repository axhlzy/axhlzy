name: Download Daily Wallpaper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wallpapers
        run: |
          mkdir -p ./assets

          # 1. Download Unsplash daily image
          ACCESS_KEY="${{ secrets.UNSPLASH_ACCESS_KEY }}"
          if [ -n "$ACCESS_KEY" ]; then
            echo "Fetching Unsplash daily image..."
            UNSPLASH_RES=$(curl -sSL -H "Authorization: Client-ID $ACCESS_KEY" "https://api.unsplash.com/photos/random?featured=true" || true)
            FULL_URL=$(echo "$UNSPLASH_RES" | jq -r '.urls.full // empty')
            RAW_URL=$(echo "$UNSPLASH_RES" | jq -r '.urls.raw // empty')

            if [ -n "$FULL_URL" ]; then
              echo "Downloading Unsplash full wallpaper..."
              curl -fsSL "$FULL_URL" -o ./assets/unsplash_wallpaper.jpg || true
            fi
            if [ -n "$RAW_URL" ]; then
              echo "Downloading Unsplash 4K wallpaper..."
              curl -fsSL "${RAW_URL}&w=4096&h=2160&fit=crop&q=80" -o ./assets/unsplash_wallpaper_4k.jpg || true
              echo "Downloading Unsplash 1080p wallpaper..."
              curl -fsSL "${RAW_URL}&w=1920&h=1080&fit=crop&q=80" -o ./assets/unsplash_wallpaper_1080p.jpg || true
            fi
          else
            echo "::warning::UNSPLASH_ACCESS_KEY is not set or empty, skipping Unsplash download."
          fi

          # 2. Download Bing daily wallpaper
          echo "Fetching Bing daily wallpaper..."
          BING_RES=$(curl -sSL "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN" || true)
          BING_BASE=$(echo "$BING_RES" | jq -r '.images[0].urlbase // empty')
          if [ -n "$BING_BASE" ]; then
            echo "Downloading Bing 4K wallpaper..."
            curl -fsSL "https://www.bing.com${BING_BASE}_UHD.jpg" -o ./assets/bing_wallpaper_4k.jpg || curl -fsSL "https://www.bing.com${BING_BASE}_1920x1080.jpg" -o ./assets/bing_wallpaper_4k.jpg || true
            echo "Downloading Bing 1080p wallpaper..."
            curl -fsSL "https://www.bing.com${BING_BASE}_1920x1080.jpg" -o ./assets/bing_wallpaper_1080p.jpg || true
          fi

      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9.1.4
        with:
          message: 'Download Daily Wallpaper'
